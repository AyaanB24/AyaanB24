<svg width="900" height="440" viewBox="0 0 900 440" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono', 'Fira Code', Consolas, monospace">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="50%" stop-color="#101820"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1a2530"/>
      <stop offset="100%" stop-color="#0f1720"/>
    </linearGradient>
    <linearGradient id="boxFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#132840"/>
    </linearGradient>
    <linearGradient id="boxTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="boxSide" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f2340"/>
      <stop offset="100%" stop-color="#0a1a30"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .line { opacity: 0; animation: fadeIn 0.4s ease-out forwards; }
      @keyframes fadeIn {
        from { opacity: 0; transform: translateX(-6px); }
        to   { opacity: 1; transform: translateX(0); }
      }
      .l1  { animation-delay: 0.1s; }
      .l2  { animation-delay: 0.35s; }
      .l3  { animation-delay: 0.6s; }
      .l4  { animation-delay: 0.85s; }
      .l5  { animation-delay: 1.1s; }
      .l6  { animation-delay: 1.35s; }
      .l7  { animation-delay: 1.6s; }
      .l8  { animation-delay: 1.85s; }
      .l9  { animation-delay: 2.1s; }
      .l10 { animation-delay: 2.35s; }
      .l11 { animation-delay: 2.6s; }
      .l12 { animation-delay: 2.85s; }
      .l13 { animation-delay: 3.1s; }

      .box {
        opacity: 0;
        animation: fadeInBox 1s ease-out forwards, floaty 3.2s ease-in-out infinite 1.2s;
        animation-delay: 0s, 1.2s;
        transform-origin: 150px 210px;
      }
      @keyframes fadeInBox {
        from { opacity: 0; }
        to   { opacity: 1; }
      }
      @keyframes floaty {
        0%, 100% { transform: translateY(0px); }
        50%      { transform: translateY(-5px); }
      }

      .spinGear {
        transform-origin: 150px 128px;
        animation: spin 6s linear infinite;
      }
      @keyframes spin {
        from { transform: rotate(0deg); }
        to   { transform: rotate(360deg); }
      }

      .pulseDot {
        animation: pulse 1.6s ease-in-out infinite;
      }
      .pulseDot.d2 { animation-delay: 0.3s; }
      .pulseDot.d3 { animation-delay: 0.6s; }
      @keyframes pulse {
        0%, 100% { opacity: 0.35; }
        50%      { opacity: 1; }
      }

      .cursor { animation: blink 1s steps(1) infinite; }
      @keyframes blink {
        0%, 49%  { opacity: 1; }
        50%, 100%{ opacity: 0; }
      }

      .prompt   { fill: #22c55e; }
      .label    { fill: #38bdf8; }
      .value    { fill: #e6edf3; }
      .dim      { fill: #64748b; }
      .accent   { fill: #f59e0b; }
      .titletxt { fill: #94a3b8; font-size: 12px; }
    </style>
  </defs>

  <!-- window background -->
  <rect x="0" y="0" width="900" height="440" rx="14" fill="url(#bgGrad)" stroke="#22303c" stroke-width="1"/>

  <!-- title bar -->
  <path d="M0,14 A14,14 0 0 1 14,0 H886 A14,14 0 0 1 900,14 V44 H0 Z" fill="url(#titleGrad)"/>
  <circle cx="26" cy="22" r="6" fill="#ff5f56"/>
  <circle cx="46" cy="22" r="6" fill="#ffbd2e"/>
  <circle cx="66" cy="22" r="6" fill="#27c93f"/>
  <text x="450" y="27" text-anchor="middle" class="titletxt">ayaan@devops-workstation: ~</text>

  <!-- shipping container / pod icon -->
  <g class="box" transform="translate(55,90)" filter="url(#glow)">
    <!-- isometric container -->
    <!-- top face -->
    <polygon points="20,30 130,30 160,10 50,10" fill="url(#boxTop)" stroke="#3b82f6" stroke-width="1"/>
    <!-- front face -->
    <polygon points="20,30 130,30 130,110 20,110" fill="url(#boxFace)" stroke="#0a1a30" stroke-width="1"/>
    <!-- side face -->
    <polygon points="130,30 160,10 160,90 130,110" fill="url(#boxSide)" stroke="#0a1a30" stroke-width="1"/>

    <!-- corrugation lines on front -->
    <line x1="35" y1="30" x2="35" y2="110" stroke="#0a1a30" stroke-width="1.5"/>
    <line x1="50" y1="30" x2="50" y2="110" stroke="#0a1a30" stroke-width="1.5"/>
    <line x1="65" y1="30" x2="65" y2="110" stroke="#0a1a30" stroke-width="1.5"/>
    <line x1="80" y1="30" x2="80" y2="110" stroke="#0a1a30" stroke-width="1.5"/>
    <line x1="95" y1="30" x2="95" y2="110" stroke="#0a1a30" stroke-width="1.5"/>
    <line x1="110" y1="30" x2="110" y2="110" stroke="#0a1a30" stroke-width="1.5"/>

    <!-- container label -->
    <rect x="45" y="55" width="60" height="18" rx="2" fill="#0d1117" stroke="#38bdf8" stroke-width="1"/>
    <text x="75" y="68" text-anchor="middle" font-size="9" fill="#38bdf8" font-weight="bold">POD-01</text>

    <!-- status lights -->
    <circle class="pulseDot" cx="30" cy="98" r="3.5" fill="#22c55e"/>
    <circle class="pulseDot d2" cx="42" cy="98" r="3.5" fill="#38bdf8"/>
    <circle class="pulseDot d3" cx="54" cy="98" r="3.5" fill="#f59e0b"/>

    <!-- ground shadow -->
    <ellipse cx="90" cy="122" rx="70" ry="6" fill="#000000" opacity="0.35"/>
  </g>

  <!-- small gear top-right of container, representing automation/orchestration -->
  <g class="spinGear" transform="translate(0,0)" opacity="0.85">
    <g transform="translate(150,50)">
      <path d="M0,-14 L3,-14 L4,-9 L8,-7.5 L12,-10.5 L14,-8.5 L11,-4.5 L12.5,0 L17,1 L17,4 L12.5,5 L11,9.5 L14,13 L12,15 L8,12 L4,13.5 L3,18 L0,18 L-1,13.5 L-5,12 L-9,15 L-11,13 L-8,9.5 L-9.5,5 L-14,4 L-14,1 L-9.5,0 L-8,-4.5 L-11,-8.5 L-9,-10.5 L-5,-7.5 L-1,-9 Z"
            fill="#38bdf8" stroke="#1d4ed8" stroke-width="0.5"/>
      <circle cx="1.5" cy="2" r="5" fill="#0d1117"/>
    </g>
  </g>

  <!-- neofetch text block -->
  <g font-size="14.5" transform="translate(260,70)">
    <text x="0" y="0"  class="line l1 prompt">ayaan@devops ~ %</text>
    <text x="0" y="18" class="line l2 dim">-------------------</text>

    <text x="0" y="42"  class="line l3"><tspan class="label">System</tspan><tspan class="dim">....: </tspan><tspan class="value">B.Tech CSE (IoT &amp; CSBT) — ADCET, Ashta</tspan></text>
    <text x="0" y="64"  class="line l4"><tspan class="label">Education</tspan><tspan class="dim">.: </tspan><tspan class="value">CGPA 8.79</tspan></text>
    <text x="0" y="86"  class="line l5"><tspan class="label">Uptime</tspan><tspan class="dim">....: </tspan><tspan class="value">Aug 2024 → May 2027 (Expected)</tspan></text>
    <text x="0" y="108" class="line l6"><tspan class="label">Shell</tspan><tspan class="dim">.....: </tspan><tspan class="value">Bash · PowerShell</tspan></text>
    <text x="0" y="130" class="line l7"><tspan class="label">Tools</tspan><tspan class="dim">.....: </tspan><tspan class="value">Git · Docker · Kubernetes · Terraform</tspan></text>
    <text x="0" y="152" class="line l8"><tspan class="label">CI/CD</tspan><tspan class="dim">.....: </tspan><tspan class="value">Jenkins · GitHub Actions</tspan></text>
    <text x="0" y="174" class="line l9"><tspan class="label">Stack</tspan><tspan class="dim">.....: </tspan><tspan class="value">Java · Spring Boot · React</tspan></text>
    <text x="0" y="196" class="line l10"><tspan class="label">Cloud</tspan><tspan class="dim">.....: </tspan><tspan class="value">AWS · EC2 · S3 · CloudFront</tspan></text>
    <text x="0" y="218" class="line l11"><tspan class="label">Security</tspan><tspan class="dim">..: </tspan><tspan class="value">Trivy · SonarQube · Semgrep</tspan></text>
    <text x="0" y="240" class="line l12"><tspan class="label">Focus</tspan><tspan class="dim">.....: </tspan><tspan class="accent">DevOps · DevSecOps · Cloud Automation</tspan></text>
    <text x="0" y="262" class="line l13"><tspan class="label">Target</tspan><tspan class="dim">....: </tspan><tspan class="value">DevOps / DevSecOps / Cloud Engineering</tspan></text>
    <text x="93" y="282" class="line l13 value">Internships</text>

    <text x="0" y="308" class="line l13"><tspan class="prompt">ayaan@devops ~ % </tspan><tspan class="cursor value">▍</tspan></text>
  </g>

  <!-- color swatch row -->
  <g class="line l13" transform="translate(260,322)">
    <rect x="0"  y="0" width="16" height="16" rx="3" fill="#ff5f56"/>
    <rect x="20" y="0" width="16" height="16" rx="3" fill="#ffbd2e"/>
    <rect x="40" y="0" width="16" height="16" rx="3" fill="#27c93f"/>
    <rect x="60" y="0" width="16" height="16" rx="3" fill="#38bdf8"/>
    <rect x="80" y="0" width="16" height="16" rx="3" fill="#a78bfa"/>
    <rect x="100" y="0" width="16" height="16" rx="3" fill="#f472b6"/>
    <rect x="120" y="0" width="16" height="16" rx="3" fill="#94a3b8"/>
    <rect x="140" y="0" width="16" height="16" rx="3" fill="#e6edf3"/>
  </g>
</svg>
